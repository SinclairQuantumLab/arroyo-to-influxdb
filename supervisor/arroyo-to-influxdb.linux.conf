; Copy this file unchanged into the Supervisor conf.d folder.
; The relay checkout is expected at $HOME/Projects/arroyo-to-influxdb.
[program:arroyo-to-influxdb]
command=/usr/bin/env bash "%(ENV_HOME)s/Projects/arroyo-to-influxdb/Startup.sh"
directory=%(ENV_HOME)s/Projects/arroyo-to-influxdb
process_name=%(program_name)s
autostart=false
startsecs=5
startretries=5
autorestart=unexpected
stopasgroup=true
killasgroup=true
stdout_logfile=%(here)s/logs/%(program_name)s_out.log
stdout_logfile_maxbytes=2MB
stdout_logfile_backups=2
stderr_logfile=%(here)s/logs/%(program_name)s_err.log
stderr_logfile_maxbytes=5MB
stderr_logfile_backups=2
