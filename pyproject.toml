[project]
name = "arroyo-to-influxdb"
version = "0.1.0"
description = "Relay Arroyo Instruments TEC and laser snapshots to InfluxDB"
requires-python = ">=3.11"
dependencies = [
    "influxdb-client>=1.50.0",
    "pyarroyo",
]

[tool.uv.sources]
pyarroyo = { path = "pyarroyo", editable = true }

[dependency-groups]
dev = [
    "pytest>=9.0",
    "ruff>=0.15",
]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
